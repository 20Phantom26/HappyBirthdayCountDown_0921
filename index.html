<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神秘生日祝福準備中...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    /* 深邃藍紫色夢幻背景 */
    body {
      background: linear-gradient(135deg, #05050f 0%, #120e2e 40%, #2a1b54 100%);
      color: #ffffff;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 全螢幕 Canvas 背景 */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* 中央毛玻璃質感卡片 */
    .container {
      position: relative;
      z-index: 10;
      background: rgba(20, 15, 45, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(192, 132, 252, 0.35);
      padding: 2.5rem 1.8rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 35px rgba(168, 85, 247, 0.25);
      width: 92%;
      max-width: 540px;
      text-align: center;
      animation: floatCard 4s ease-in-out infinite alternate;
      cursor: pointer;
    }

    @keyframes floatCard {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* 主標題樣式 */
    h1 {
      font-size: 1.35rem;
      line-height: 1.6;
      margin-bottom: 0.8rem;
      color: #f3e8ff;
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.8);
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #c084fc;
      margin-bottom: 1.8rem;
      letter-spacing: 1px;
    }

    /* 倒計時器結構 */
    .timer-display {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 1rem;
    }

    .timer-box {
      background: rgba(147, 51, 234, 0.18);
      border: 1px solid rgba(192, 132, 252, 0.4);
      padding: 0.8rem 0.3rem;
      border-radius: 14px;
      flex: 1;
      min-width: 55px;
      box-shadow: inset 0 0 12px rgba(168, 85, 247, 0.2);
    }

    .timer-box .num {
      font-size: 1.45rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.9);
    }

    .timer-box .label {
      font-size: 0.75rem;
      color: #c084fc;
      margin-top: 4px;
    }

    /* 點擊播放提示標籤 */
    .audio-hint {
      margin-top: 1.4rem;
      font-size: 0.8rem;
      color: #a855f7;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 右上角音樂開關按鈕 */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(168, 85, 247, 0.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(192, 132, 252, 0.5);
      color: #f3e8ff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .music-btn:hover {
      transform: scale(1.1);
      background: rgba(168, 85, 247, 0.45);
    }
    .music-btn.playing {
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 右上方音樂控制鈕 -->
  <button id="musicToggle" class="music-btn" title="切換音樂">🎵</button>

  <!-- 背景音樂播放器 -->
  <audio id="bgm" preload="auto" loop playsinline autoplay>
    <source src="Pink.mp3" type="audio/mpeg">
    您的瀏覽器不支援音樂播放。
  </audio>

  <!-- 星空與流星雨 Canvas -->
  <canvas id="bgCanvas"></canvas>

  <div class="container">
    <h1>🎁神秘生日祝福準備中…<br>等待Chao的生日驚喜⌛️</h1>
    <div class="subtitle">距離 2026/09/21 00:00 還有</div>
    
    <div class="timer-display">
      <div class="timer-box">
        <div class="num" id="months">0</div>
        <div class="label">月</div>
      </div>
      <div class="timer-box">
        <div class="num" id="days">0</div>
        <div class="label">天</div>
      </div>
      <div class="timer-box">
        <div class="num" id="hours">00</div>
        <div class="label">小時</div>
      </div>
      <div class="timer-box">
        <div class="num" id="minutes">00</div>
        <div class="label">分</div>
      </div>
      <div class="timer-box">
        <div class="num" id="seconds">00</div>
        <div class="label">秒</div>
      </div>
    </div>

    <div class="audio-hint" id="audioHint">🎵 點擊畫面任意處播放《頑皮豹》主題曲</div>
  </div>

  <script>
    /* ----- 音樂播放與自動解鎖控制 ----- */
    const audio = document.getElementById('bgm');
    const musicBtn = document.getElementById('musicToggle');
    const audioHint = document.getElementById('audioHint');

    function playAudio() {
      audio.play().then(() => {
        musicBtn.classList.add('playing');
        if (audioHint) audioHint.style.display = 'none';
      }).catch(err => {
        console.log("瀏覽器限制自動播放，等待點擊解鎖：", err);
      });
    }

    // 頁面載入時嘗試播放
    window.addEventListener('DOMContentLoaded', playAudio);

    // 點擊畫面任意處自動解鎖播放
    const unlockAudio = () => {
      if (audio.paused) {
        playAudio();
      }
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
    };
    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    // 按鈕手動控制
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audio.paused) {
        audio.play();
        musicBtn.classList.add('playing');
        if (audioHint) audioHint.style.display = 'none';
      } else {
        audio.pause();
        musicBtn.classList.remove('playing');
      }
    });

    /* ----- 多星星與藍紫色流星雨 Canvas 背景 ----- */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 繁星 350 顆
    const stars = Array.from({ length: 350 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.8,
      alpha: Math.random(),
      speed: Math.random() * 0.02 + 0.005,
      color: Math.random() > 0.4 ? '#ffffff' : (Math.random() > 0.5 ? '#c084fc' : '#818cf8')
    }));

    // 流星雨 8 條
    const meteors = Array.from({ length: 8 }, () => ({
      x: Math.random() * canvas.width + 200,
      y: Math.random() * (canvas.height / 2) - 100,
      length: Math.random() * 100 + 70,
      speed: Math.random() * 6 + 4,
      alpha: Math.random() * 0.8 + 0.2
    }));

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;

      meteors.forEach(m => {
        m.x -= m.speed;
        m.y += m.speed;

        if (m.x < -100 || m.y > canvas.height + 100) {
          m.x = Math.random() * canvas.width + 300;
          m.y = Math.random() * -100;
          m.speed = Math.random() * 6 + 4;
        }

        const gradient = ctx.createLinearGradient(m.x, m.y, m.x + m.length, m.y - m.length);
        gradient.addColorStop(0, 'rgba(192, 132, 252, 1)');
        gradient.addColorStop(0.5, 'rgba(129, 140, 248, 0.5)');
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.length, m.y - m.length);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2.2;
        ctx.stroke();
      });

      requestAnimationFrame(drawBackground);
    }
    drawBackground();

    /* ----- 生日倒計時器：2026/09/21 00:00:00 ----- */
    const targetDate = new Date(2026, 8, 21, 0, 0, 0);

    function updateTimer() {
      const now = new Date();

      if (now < targetDate) {
        let months = (targetDate.getFullYear() - now.getFullYear()) * 12 + (targetDate.getMonth() - now.getMonth());
        
        let tempDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
        if (tempDate > targetDate) {
          months--;
          tempDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
        }

        const diff = targetDate - tempDate;

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('months').textContent = months;
        document.getElementById('days').textContent = d;
        document.getElementById('hours').textContent = String(h).padStart(2, '0');
        document.getElementById('minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('seconds').textContent = String(s).padStart(2, '0');
      } else {
        document.getElementById('months').textContent = '0';
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
      }
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
